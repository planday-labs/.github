name: Copilot Review & Auto-approve

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  copilot-review-and-approve:
    runs-on: ubuntu-latest
    if: github.actor != 'MitchellPaff'
    steps:
      - name: Request Copilot review
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.LABS_PAT }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-reviewer "copilot-swe" --repo "${{ github.repository }}"

      - name: Auto-approve PR
        env:
          GH_TOKEN: ${{ secrets.LABS_PAT }}
        run: gh pr review "${{ github.event.pull_request.number }}" --approve --body "✅ Copilot review requested. Auto-approved so you can merge once you are happy with the feedback." --repo "${{ github.repository }}"
